<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <title>Doku</title>
    <script>
      // Sets data-theme before first paint (src/app/theme.ts does the live part). Keep the
      // colours in sync with THEME_COLOR there.
      (function () {
        var theme = null;
        try {
          var saved = JSON.parse(localStorage.getItem("doku:settings"));
          theme = saved && saved.theme;
        } catch (e) {}
        var dark = theme === "dark";
        if (theme !== "dark" && theme !== "light") {
          try {
            dark = matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (e) {}
        }
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = dark ? "#1c1917" : "#ffffff";
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
